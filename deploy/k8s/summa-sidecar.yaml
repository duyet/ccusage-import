# k3s / Hermes: summa as an *import client*, not a telemetry server.
# Hub is the Cloudflare Worker at https://summa.duyet.net (apps/api, Rust).
# This pod only runs `summa import` (and optional hourly CronJob).
# Sidebar: iframe https://summa.duyet.net (not localhost:8787).
# Placeholders only — do not apply this Secret with empty tokens.
# Homelab Hermes sidecar uses Secret `summa-import` in namespace hermes-agent.
---
apiVersion: v1
kind: Secret
metadata:
  name: summa-import
  namespace: hermes-agent
  labels:
    app: summa
type: Opaque
stringData:
  SUMMA_TELEMETRY_ENDPOINT: "https://summa.duyet.net"
  SUMMA_TELEMETRY_TOKEN: ""
  DUCKDB_PATH: "/tmp/summa.duckdb"
  CH_HOST: "clickhouse.clickhouse.svc.cluster.local"
  CH_PORT: "8123"
  CH_USER: "duyet"
  CH_PASSWORD: ""
  CH_DATABASE: "duyet_analytics"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: summa-import
  namespace: hermes-agent
  labels:
    app: summa
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: summa-import
              image: ghcr.io/duyet/summa:latest
              args: ["import", "--days-back=2"]
              envFrom:
                - secretRef:
                    name: summa-import
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
