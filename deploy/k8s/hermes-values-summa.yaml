# Overlay for duyet/hermes-agent on homelab k3s.
# Telemetry API is NOT in-cluster: clients POST to https://summa.duyet.net.
# Sidecar imports Hermes logs, writes in-cluster ClickHouse, POSTs the hub.
#
# extraContainers here is the summa sidecar only. Helm list-replaces, so
# merge with existing extraContainers (welcome-back) before upgrade.
#
#   helm upgrade hermes duyet/hermes-agent -n hermes-agent \
#     --reuse-values -f deploy/k8s/hermes-values-summa.yaml
#
# Secret `summa-import` in namespace hermes-agent must include
# SUMMA_TELEMETRY_ENDPOINT and SUMMA_TELEMETRY_TOKEN.
# Dashboard iframe: https://summa.duyet.net

extraVolumes:
  - name: summa-bin
    hostPath:
      path: /home/duyet/.local/bin
      type: Directory
  - name: summa-tmp
    emptyDir: {}
  - name: host-certs
    hostPath:
      path: /etc/ssl/certs
      type: Directory

extraContainers:
  - name: summa-import
    image: ubuntu:24.04
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        BIN=/opt/summa-bin/summa
        echo "summa-import sidecar starting $(date -u +%FT%TZ)"
        "$BIN" --version || echo "warn: summa binary missing at $BIN"
        while true; do
          echo "=== summa import $(date -u +%FT%TZ) ==="
          "$BIN" import \
            --skip-ccusage --skip-codex --skip-opencode \
            --skip-antigravity --skip-grok \
            --days-back=7 \
            || echo "warn: import failed"
          sleep 21600
        done
    env:
      - name: HERMES_HOME
        value: /opt/data
      - name: HOME
        value: /tmp
      - name: SSL_CERT_FILE
        value: /etc/ssl/certs/ca-certificates.crt
      - name: IMPORT_MACHINE_NAME
        value: duet-ubuntu-hermes
      - name: CH_HOST
        value: clickhouse.clickhouse.svc.cluster.local
      - name: CH_PORT
        value: "8123"
    envFrom:
      - secretRef:
          name: summa-import
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
    volumeMounts:
      - name: data
        mountPath: /opt/data
        readOnly: true
      - name: summa-bin
        mountPath: /opt/summa-bin
        readOnly: true
      - name: summa-tmp
        mountPath: /tmp
      - name: host-certs
        mountPath: /etc/ssl/certs
        readOnly: true
