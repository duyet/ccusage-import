# Overlay for the public duyet/hermes-agent Helm chart (k3s).
# Telemetry API is NOT in-cluster: clients POST to https://summa.duyet.net.
# This sidecar only runs hourly import from the Hermes node (local logs/DBs),
# then the CLI posts events to the cloud hub.
#
#   helm upgrade hermes duyet/hermes-agent -f hermes-values-summa.yaml
#
# Secret `summa-telemetry` must include SUMMA_TELEMETRY_ENDPOINT and
# SUMMA_TELEMETRY_TOKEN (see summa-sidecar.yaml). Dashboard iframe:
# https://summa.duyet.net — not http://127.0.0.1:8787.

extraContainers:
  - name: summa-import
    image: ghcr.io/duyet/summa:latest
    command: ["sh", "-c"]
    args:
      - |
        while true; do
          summa import --days-back=2 || true
          sleep 3600
        done
    envFrom:
      - secretRef:
          name: summa-telemetry
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
