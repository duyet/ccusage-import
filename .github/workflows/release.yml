name: Release

# Build stripped binaries + optional crates.io publish when a GitHub Release
# is published (release-please creates the release on merge of its PR).
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0); empty = current HEAD"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: summa-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: summa-aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: summa-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: summa-x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binary
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} -p summa-import --bin summa
          else
            cargo build --locked --release --target ${{ matrix.target }} -p summa-import --bin summa
          fi

      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/summa"
          if [ ! -f "$BIN" ]; then
            BIN="target/${{ matrix.target }}/release/summa.exe"
          fi
          STAGE="dist/${{ matrix.asset }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/summa"
          chmod +x "$STAGE/summa" || true
          cp README.md LICENSE CHANGELOG.md "$STAGE/" 2>/dev/null || true
          (
            cd dist
            tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          )
          ls -lah "dist/${{ matrix.asset }}.tar.gz"
          shasum -a 256 "dist/${{ matrix.asset }}.tar.gz" > "dist/${{ matrix.asset }}.tar.gz.sha256"
          # strip already applied via profile; record size for release notes
          du -h "$STAGE/summa" | tee dist/size-${{ matrix.asset }}.txt

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
            dist/size-${{ matrix.asset }}.txt

  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build-binaries]
    # Only on real GitHub Releases, and only when the token secret is set.
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: crates-io-publish

      - name: cargo package -p summa-import (verify)
        run: cargo package --locked -p summa-import --list | head -100

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            echo "Add the secret under repo Settings → Secrets to enable."
            exit 0
          fi
          cargo publish --locked -p summa-import
