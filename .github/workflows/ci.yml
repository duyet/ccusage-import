name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (check / test / release build)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: cargo check
      run: cargo check --locked

    - name: cargo test
      # Env-mutating config/credentials tests race under the default thread pool.
      run: cargo test --locked -- --test-threads=1

    - name: cargo build --release
      run: cargo build --release --bin summa

    - name: Binary size
      run: ls -lah target/release/summa && file target/release/summa

  status-check:
    name: All checks passed
    if: always()
    needs: [rust]
    runs-on: ubuntu-latest
    steps:
    - name: Check required jobs
      run: |
        if [ "${{ needs.rust.result }}" != "success" ]; then
          echo "Rust job failed"
          exit 1
        fi
        echo "All required checks passed!"
