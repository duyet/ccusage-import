name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (check / test / release build)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: cargo check
      run: cargo check --locked

    - name: cargo test
      # Env-mutating config/credentials tests race under the default thread pool.
      run: cargo test --locked -- --test-threads=1

    - name: cargo build --release
      run: cargo build --release --bin summa

    - name: Binary size
      run: ls -lah target/release/summa && file target/release/summa

    - name: Package linux x86_64 artifact
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        set -euo pipefail
        ASSET=summa-x86_64-unknown-linux-gnu
        mkdir -p "dist/${ASSET}"
        cp target/release/summa "dist/${ASSET}/summa"
        chmod +x "dist/${ASSET}/summa"
        (cd dist && tar -czf "${ASSET}.tar.gz" "${ASSET}")
        shasum -a 256 "dist/${ASSET}.tar.gz" > "dist/${ASSET}.tar.gz.sha256"

    - name: Upload linux x86_64 artifact
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v7
      with:
        name: summa-x86_64-unknown-linux-gnu
        path: |
          dist/summa-x86_64-unknown-linux-gnu.tar.gz
          dist/summa-x86_64-unknown-linux-gnu.tar.gz.sha256

  api:
    name: API Worker (Rust wasm check)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: api-wasm
    - name: cargo check -p summa-api --target wasm32-unknown-unknown
      run: cargo check -p summa-api --target wasm32-unknown-unknown

  status-check:
    name: All checks passed
    if: always()
    needs: [rust, api]
    runs-on: ubuntu-latest
    steps:
    - name: Check required jobs
      run: |
        if [ "${{ needs.rust.result }}" != "success" ]; then
          echo "Rust job failed"
          exit 1
        fi
        if [ "${{ needs.api.result }}" != "success" ]; then
          echo "API job failed"
          exit 1
        fi
        echo "All required checks passed!"
