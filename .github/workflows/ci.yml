name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (check / test / release build)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: cargo check
      run: cargo check --locked

    - name: cargo test
      run: cargo test --locked

    - name: cargo build --release
      run: cargo build --release --bin summa

    - name: Binary size
      run: ls -lah target/release/summa && file target/release/summa

  lint:
    name: Build Check (Bun legacy)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build
      run: bun run build

  test:
    name: Test (Bun legacy)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run tests
      run: bun test

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run bun audit
      continue-on-error: true
      run: bun audit --audit-level=high

  status-check:
    name: All checks passed
    if: always()
    needs: [rust, lint, test, security]
    runs-on: ubuntu-latest

    steps:
    - name: Check all job status
      run: |
        if [ "${{ needs.rust.result }}" != "success" ]; then
          echo "Rust job failed"
          exit 1
        fi
        if [ "${{ needs.lint.result }}" != "success" ]; then
          echo "Build job failed"
          exit 1
        fi
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Test job failed"
          exit 1
        fi
        # Security is allowed to fail (continue-on-error)
        echo "All required checks passed!"
