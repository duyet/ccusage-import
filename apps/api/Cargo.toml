[package]
name = "summa-api"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "summa telemetry API (Cloudflare Worker)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ["d1", "http"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
