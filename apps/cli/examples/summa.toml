# Example main config for summa (no secrets).
# Copy to ~/.config/summa/config.toml or ./summa.toml
#
# Credentials live separately in:
#   ~/.config/summa/credentials.toml

[clickhouse]
host = "localhost"
port = 8123
user = "default"
database = "analytics"
protocol = "http"
# password = ""  # prefer credentials.toml or CH_PASSWORD

[importer]
# Omit duckdb_path for local-first default:
#   macOS: ~/Library/Application Support/summa/summa.duckdb
#   Linux: ~/.local/share/summa/summa.duckdb
# duckdb_path = "md:ccusage"   # MotherDuck (needs motherduck_token)
days_back = 7
hash_project_names = true
# Keep skip_cursor / skip_grok off on every machine. Cursor is account-wide
# (machine_name=account); sinks already dedup — do not skip to avoid double-count.
# skip_cursor = false
# skip_grok = false

# Cloud hub — every machine POSTs here; the worker double-writes DuckDB/CH.
[telemetry]
endpoint = "https://summa.duyet.net"
# token lives in credentials.toml as telemetry_token
